# =============================================================================
# n8n.devpilotx.com  ->  127.0.0.1:5678  (n8n container, host-networked, local)
# ISOLATED vhost added for n8n. Does NOT modify any existing site.
# WebSocket upgrade is REQUIRED for the n8n editor push (else "Connection lost").
# Deploy to: /etc/nginx/sites-available/n8n.devpilotx.com  (symlink into sites-enabled)
# =============================================================================

map $http_upgrade $n8n_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name n8n.devpilotx.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name n8n.devpilotx.com;

    ssl_certificate     /etc/letsencrypt/live/n8n.devpilotx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.devpilotx.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 100m;

    # ---- TEMPORARY front-door lock (protects the owner-setup window) ----
    auth_basic           "n8n (private)";
    auth_basic_user_file /opt/n8n/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $n8n_conn_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_redirect      off;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
