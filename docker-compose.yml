# ==============================================================================
# n8n - private self-hosted instance @ https://n8n.devpilotx.com
# Official prebuilt image ONLY (n8nio/n8n:latest). No source build.
#
# Networking: host mode so n8n can reach the EXISTING host PostgreSQL on
#   127.0.0.1:5432 WITHOUT reconfiguring Postgres. n8n binds to 127.0.0.1:5678
#   only (N8N_LISTEN_ADDRESS) - never exposed publicly. Public access is via
#   the nginx vhost (HTTPS) -> 127.0.0.1:5678.
#
# Secrets (N8N_ENCRYPTION_KEY, DB_POSTGRESDB_PASSWORD) are read from /opt/n8n/.env
# ==============================================================================
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    network_mode: host
    environment:
      # --- public URL / reverse proxy ---
      - N8N_HOST=n8n.devpilotx.com
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - N8N_LISTEN_ADDRESS=127.0.0.1
      - WEBHOOK_URL=https://n8n.devpilotx.com/
      - N8N_EDITOR_BASE_URL=https://n8n.devpilotx.com/
      - N8N_PROXY_HOPS=1
      # --- timezone ---
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      # --- auth / security ---
      - N8N_MFA_ENABLED=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      # --- nodes: re-enable Execute Command (n8n 2.0 disables it by default; CLI paths need it) ---
      - "NODES_EXCLUDE=[]"
      # --- execution data pruning ---
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      # --- database: EXISTING host PostgreSQL (new db 'n8n' / user 'n8n_user') ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=127.0.0.1
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n_user
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD}
      # --- data folder + CLI home (subscription CLIs run via Execute Command) ---
      - N8N_USER_FOLDER=/home/node
      - HOME=/opt/clis/home
      - PATH=/opt/clis/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - /opt/n8n/data:/home/node/.n8n
      - /opt/n8n/clis:/opt/clis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
